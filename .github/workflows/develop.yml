name: Development CI/CD

on:
  push:
    branches: [ development ]

jobs:
  # ==========================================================
  # JOB 1 — Build on GitHub-hosted runner (cloud)
  # ==========================================================
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'   # <-- set this to YOUR project's .NET version

    - name: Build
      run: dotnet build --configuration Release

    - name: Publish
      run: dotnet publish -c Release -o publish

    - name: Upload published output as artifact
      uses: actions/upload-artifact@v4
      with:
        name: publish
        path: publish/
        retention-days: 1

  # ==========================================================
  # JOB 2 — Deploy on self-hosted runner (your IIS server)
  # ==========================================================
  deploy:
    needs: build
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4   # needed so the .ps1 scripts are present on the server

    - name: Set Environment Variables
      shell: pwsh
      run: |
          switch ("${{ github.ref_name }}") {

            "develop" {
              echo "ENVIRONMENT=Development" >> $env:GITHUB_ENV
              echo "SITE_NAME=GFT-DEV" >> $env:GITHUB_ENV
              echo "APP_POOL=GFT-DEV" >> $env:GITHUB_ENV
              echo "DEPLOY_PATH=D:\Sites\GFT\Dev" >> $env:GITHUB_ENV
              echo "BACKUP_PATH=D:\Backups\GFT\Dev" >> $env:GITHUB_ENV
              echo "SITE_URL=https://dev.geneticfamilytree.ai" >> $env:GITHUB_ENV
              break
            }

            "test" {
              echo "ENVIRONMENT=Testing" >> $env:GITHUB_ENV
              echo "SITE_NAME=GFT-TEST" >> $env:GITHUB_ENV
              echo "APP_POOL=GFT-TEST" >> $env:GITHUB_ENV
              echo "DEPLOY_PATH=D:\Sites\GFT\Test" >> $env:GITHUB_ENV
              echo "BACKUP_PATH=D:\Backups\GFT\Test" >> $env:GITHUB_ENV
              echo "SITE_URL=https://test.geneticfamilytree.ai" >> $env:GITHUB_ENV
              break
            }

            "uat" {
              echo "ENVIRONMENT=UAT" >> $env:GITHUB_ENV
              echo "SITE_NAME=GFT-UAT" >> $env:GITHUB_ENV
              echo "APP_POOL=GFT-UAT" >> $env:GITHUB_ENV
              echo "DEPLOY_PATH=D:\Sites\GFT\UAT" >> $env:GITHUB_ENV
              echo "BACKUP_PATH=D:\Backups\GFT\UAT" >> $env:GITHUB_ENV
              echo "SITE_URL=https://uat.geneticfamilytree.ai" >> $env:GITHUB_ENV
              break
            }

            "main" {
              echo "ENVIRONMENT=Production" >> $env:GITHUB_ENV
              echo "SITE_NAME=GFT-PROD" >> $env:GITHUB_ENV
              echo "APP_POOL=GFT-PROD" >> $env:GITHUB_ENV
              echo "DEPLOY_PATH=D:\Sites\GFT\Production" >> $env:GITHUB_ENV
              echo "BACKUP_PATH=D:\Backups\GFT\Production" >> $env:GITHUB_ENV
              echo "SITE_URL=https://geneticfamilytree.ai" >> $env:GITHUB_ENV
              break
            }

            default {
              throw "Unknown branch: ${{ github.ref_name }}"
            }
            
    - name: Set Initial Stage
      run: echo "FAILED_STAGE=START" >> $env:GITHUB_ENV

    - name: Download published artifact
      run: echo "FAILED_STAGE=DOWNLOAD" >> $env:GITHUB_ENV
      # (stage marker; actual download in next step)

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: publish
        path: publish

    - name: Configure App Settings
      run: |
        echo "FAILED_STAGE=CONFIGURE" >> $env:GITHUB_ENV
        powershell .github/workflows/scripts/set-appsettings.ps1 `
          -AppSettingsPath "publish\appsettings.json" `
          -DbServer "${{ secrets.DB_SERVER }}" `
          -DbName "${{ secrets.DB_NAME }}" `
          -DbUser "${{ secrets.DB_USER }}" `
          -DbPassword "${{ secrets.DB_PASSWORD }}" `
          -JwtKey "${{ secrets.JWT_KEY }}" `
          -GraphTenantId "${{ secrets.GRAPH_TENANT_ID }}" `
          -GraphClientId "${{ secrets.GRAPH_CLIENT_ID }}" `
          -GraphClientSecret "${{ secrets.GRAPH_CLIENT_SECRET }}" `
          -GraphFromUser "${{ secrets.GRAPH_FROM_USER }}" `
          -SmtpUsername "${{ secrets.SMTP_USERNAME }}" `
          -SmtpPassword "${{ secrets.SMTP_PASSWORD }}" `
          -EncryptionCryptKey "${{ secrets.ENCRYPTION_CRYPT_KEY }}" `
          -EncryptionInitVector "${{ secrets.ENCRYPTION_INIT_VECTOR }}" `
          -RequestAccessCodeMailId "${{ secrets.REQUEST_ACCESS_CODE_MAIL_ID }}" `
          -ApiUrl "${{ secrets.API_URL }}"

    - name: Backup IIS + Database
      run: |
        echo "FAILED_STAGE=BACKUP" >> $env:GITHUB_ENV
        powershell .github/workflows/scripts/backup.ps1 `
          -SitePath "${{ secrets.IIS_SITE_PATH }}" `
          -AppPool "${{ secrets.APP_POOL_NAME }}" `
          -DbServer "${{ secrets.DB_SERVER }}" `
          -DbName "${{ secrets.DB_NAME }}" `
          -DbUser "${{ secrets.DB_USER }}" `
          -DbPassword "${{ secrets.DB_PASSWORD }}" `
          -DbBackupDir "${{ secrets.DB_BACKUP_DIR }}" `
          -ApiFilesPath "${{ secrets.API_FILES_PATH }}"

    - name: Deploy
      run: |
        echo "FAILED_STAGE=DEPLOY" >> $env:GITHUB_ENV
        powershell .github/workflows/scripts/deploy.ps1 `
          -SitePath "${{ secrets.IIS_SITE_PATH }}" `
          -AppPool "${{ secrets.APP_POOL_NAME }}"

    - name: Verify App Pool
      run: |
        Write-Host "Checking App Pool Status... "
        Import-Module WebAdministration
        $poolStatus = Get-WebAppPoolState -Name "${{ secrets.APP_POOL_NAME }}"
        Write-Host "App Pool Status: $($poolStatus.Value)"
        if ($poolStatus.Value -ne "Started") {
          Write-Host "ERROR: App Pool is not running!"
          exit 1
        }
        Write-Host "App Pool is running"

    - name: Health Check
      run: |
        echo "FAILED_STAGE=HEALTH_CHECK" >> $env:GITHUB_ENV
        $healthUrl = "${{ secrets.HEALTH_URL }}"
        Write-Host "Health Check URL: $healthUrl"
        $maxAttempts = 5
        $attempt = 0
        while ($attempt -lt $maxAttempts) {
            $attempt++
            Write-Host "Attempt $attempt of $maxAttempts..."
            $statusCode = curl.exe -s -o nul -w "%{http_code}" $healthUrl
            Write-Host "Status Code: $statusCode"
            if ($statusCode -eq "200") {
                Write-Host "Health Check PASSED"
                exit 0
            }
            if ($attempt -lt $maxAttempts) {
                Start-Sleep -Seconds 2
            }
        }
        Write-Host "Health Check FAILED after $maxAttempts attempts"
        exit 1

    - name: Rollback on Failure
      if: failure()
      run: |
        Write-Host "Pipeline failed at stage: $env:FAILED_STAGE"
        powershell .github/workflows/scripts/rollback.ps1 `
          -SitePath "${{ secrets.IIS_SITE_PATH }}" `
          -AppPool "${{ secrets.APP_POOL_NAME }}" `
          -DbServer "${{ secrets.DB_SERVER }}" `
          -DbName "${{ secrets.DB_NAME }}" `
          -DbUser "${{ secrets.DB_USER }}" `
          -DbPassword "${{ secrets.DB_PASSWORD }}" `
          -DbBackupDir "${{ secrets.DB_BACKUP_DIR }}" `
          -ApiFilesPath "${{ secrets.API_FILES_PATH }}"
