name: Development CI/CD

on:
  push:
    branches: [ development ]

jobs:
  build-deploy:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Set Initial Stage
      run: echo "FAILED_STAGE=START" >> $GITHUB_ENV

    - name: Build
      run: |
        echo "FAILED_STAGE=BUILD" >> $GITHUB_ENV
        dotnet build --configuration Release

    - name: Publish
      run: |
        echo "FAILED_STAGE=PUBLISH" >> $GITHUB_ENV
        dotnet publish -c Release -o publish

    - name: Configure App Settings
      run: |
        echo "FAILED_STAGE=CONFIGURE" >> $GITHUB_ENV
        powershell .github/workflows/scripts/set-appsettings.ps1 `
          -AppSettingsPath "publish\appsettings.json" `
          -DbServer "${{ secrets.DB_SERVER }}" `
          -DbName "${{ secrets.DB_NAME }}" `
          -DbUser "${{ secrets.DB_USER }}" `
          -DbPassword "${{ secrets.DB_PASSWORD }}" `
          -JwtKey "${{ secrets.JWT_KEY }}" `
          -GraphTenantId "${{ secrets.GRAPH_TENANT_ID }}" `
          -GraphClientId "${{ secrets.GRAPH_CLIENT_ID }}" `
          -GraphClientSecret "${{ secrets.GRAPH_CLIENT_SECRET }}" `
          -GraphFromUser "${{ secrets.GRAPH_FROM_USER }}" `
          -SmtpUsername "${{ secrets.SMTP_USERNAME }}" `
          -SmtpPassword "${{ secrets.SMTP_PASSWORD }}" `
          -EncryptionCryptKey "${{ secrets.ENCRYPTION_CRYPT_KEY }}" `
          -EncryptionInitVector "${{ secrets.ENCRYPTION_INIT_VECTOR }}" `
          -RequestAccessCodeMailId "${{ secrets.REQUEST_ACCESS_CODE_MAIL_ID }}" `
          -ApiUrl "${{ secrets.API_URL }}"

    - name: Backup IIS + Database
      run: |
        echo "FAILED_STAGE=BACKUP" >> $GITHUB_ENV
        powershell .github/workflows/scripts/backup.ps1 `
          -SitePath "${{ secrets.IIS_SITE_PATH }}" `
          -AppPool "${{ secrets.APP_POOL_NAME }}" `
          -DbServer "${{ secrets.DB_SERVER }}" `
          -DbName "${{ secrets.DB_NAME }}" `
          -DbUser "${{ secrets.DB_USER }}" `
          -DbPassword "${{ secrets.DB_PASSWORD }}" `
          -ApiFilesPath "${{ secrets.API_FILES_PATH }}"
          -DbBackupDir "${{ secrets.DB_BACKUP_DIR }}" `

    - name: Deploy
      run: |
        echo "FAILED_STAGE=DEPLOY" >> $GITHUB_ENV
        powershell .github/workflows/scripts/deploy.ps1 `
          -SitePath "${{ secrets.IIS_SITE_PATH }}" `
          -AppPool "${{ secrets.APP_POOL_NAME }}"

    - name: Verify App Pool
      run: |
        Write-Host "Checking App Pool Status... "
        Import-Module WebAdministration
        $poolStatus = Get-WebAppPoolState -Name "${{ secrets.APP_POOL_NAME }}"
        Write-Host "App Pool Status: $($poolStatus.Value)"
        if ($poolStatus.Value -ne "Started") {
          Write-Host "ERROR: App Pool is not running!"
          exit 1
        }
        Write-Host "App Pool is running"

    - name: Health Check
      run: |
        echo "FAILED_STAGE=HEALTH_CHECK" >> $env:GITHUB_ENV

        $healthUrl = "${{ secrets.HEALTH_URL }}"

        Write-Host "Health Check URL: $healthUrl"

        $maxAttempts = 5
        $attempt = 0

        while ($attempt -lt $maxAttempts) {
            $attempt++
            Write-Host "Attempt $attempt of $maxAttempts..."

            $statusCode = curl.exe -s -o nul -w "%{http_code}" $healthUrl

            Write-Host "Status Code: $statusCode"

            if ($statusCode -eq "200") {
                Write-Host "Health Check PASSED"
                exit 0
            }

            if ($attempt -lt $maxAttempts) {
                Start-Sleep -Seconds 2
            }
        }

        Write-Host "Health Check FAILED after $maxAttempts attempts"
        exit 1



    - name: Rollback on Failure
      if: failure()
      run: |
        Write-Host "Pipeline failed at stage: $env:FAILED_STAGE"
        powershell .github/workflows/scripts/rollback.ps1 `
          -SitePath "${{ secrets.IIS_SITE_PATH }}" `
          -DbServer "${{ secrets.DB_SERVER }}" `
          -DbName "${{ secrets.DB_NAME }}" `
          -DbName "${{ secrets.DB_NAME }}" `
          -DbUser "${{ secrets.DB_USER }}" `
          -DbBackupDir "${{ secrets.DB_BACKUP_DIR }}" `
          -ApiFilesPath "${{ secrets.API_FILES_PATH }}"
      env:
        FAILED_STAGE: "Deployment"